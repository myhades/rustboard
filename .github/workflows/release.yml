name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (v + Cargo version)
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate version tag
        shell: bash
        run: python -c 'import os,tomllib; assert os.environ["RELEASE_TAG"] == "v"+tomllib.load(open("Cargo.toml","rb"))["package"]["version"]'
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - if: runner.os == 'Windows'
        run: cargo build --release --locked
      - if: runner.os == 'Windows'
        run: ./platforms/windows/scripts/package.ps1 -OutputRoot target/release-assets
      - if: runner.os == 'Windows'
        run: |
          python scripts/release-manifests.py --windows-only --tag $env:RELEASE_TAG --assets target/release-assets --output target/manifests
          ./platforms/windows/scripts/test-scoop.ps1
      - if: runner.os == 'macOS'
        run: bash platforms/macos/scripts/test.sh && bash platforms/macos/scripts/build.sh
      - name: Sign without notarization
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: bash platforms/macos/scripts/ci-sign.sh
      - if: runner.os == 'macOS'
        run: python platforms/macos/scripts/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release-assets/*.zip
            target/release-assets/*.sha256
            target/macos/*.tar.gz
            target/macos/*.sha256
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: downloaded
      - name: Gather assets and validate manifests
        run: |
          mkdir assets
          find downloaded -type f -exec cp -n '{}' assets/ \;
          python scripts/release-manifests.py --tag "$RELEASE_TAG" --assets assets --output manifests
          cp manifests/homebrew-tap/Casks/rustboard.rb assets/
          tar -czf assets/package-manifests.tar.gz -C manifests .
      - name: Publish complete release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; do not replace published immutable assets."
            exit 1
          fi
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" assets/* --verify-tag --title "Rustboard $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-manifests
          path: manifests/
  distribute:
    needs: publish
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [homebrew, scoop]
    env:
      GH_TOKEN: ${{ matrix.target == 'homebrew' && secrets.HOMEBREW_TAP_TOKEN || secrets.SCOOP_BUCKET_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: package-manifests
          path: manifests
      - name: Update owned package repository
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$TARGET" == homebrew ]]; then
            python scripts/publish-package.py manifests/homebrew-tap/Casks/rustboard.rb homebrew
          else
            python scripts/publish-package.py manifests/scoop-bucket/bucket/rustboard.json scoop
          fi
