name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate version tag
        shell: bash
        run: python -c 'import os,tomllib; assert os.environ["RELEASE_TAG"] == "v"+tomllib.load(open("Cargo.toml","rb"))["package"]["version"]'
      - run: cargo fmt --all -- --check
      - run: python scripts/check-vectors.py
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - if: runner.os == 'Windows'
        run: cargo build --release --locked
      - if: runner.os == 'Windows'
        run: ./platforms/windows/scripts/package.ps1 -OutputRoot target/release-assets
      - if: runner.os == 'Windows'
        run: |
          python scripts/release-manifests.py --windows-only --tag $env:RELEASE_TAG --assets target/release-assets --output target/manifests
          ./platforms/windows/scripts/test-scoop.ps1
      - if: runner.os == 'macOS'
        run: bash platforms/macos/scripts/test.sh && bash platforms/macos/scripts/build.sh && bash platforms/macos/scripts/test-install.sh
      - name: Sign without notarization
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: bash platforms/macos/scripts/ci-sign.sh
      - if: runner.os == 'macOS'
        run: python platforms/macos/scripts/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release-assets/*.zip
            target/release-assets/*.sha256
            target/macos/*.tar.gz
            target/macos/*.sha256
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: downloaded
      - name: Gather assets and validate manifests
        run: |
          mkdir assets
          find downloaded -type f -exec cp -n '{}' assets/ \;
          python scripts/release-manifests.py --tag "$RELEASE_TAG" --assets assets --output manifests
          cp manifests/Casks/rustboard.rb assets/
          tar -czf assets/package-manifests.tar.gz -C manifests .
      - name: Upload assets to the explicitly published release
        run: |
          count=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')
          if [[ "$count" != 0 ]]; then
            echo "Release already has assets; do not overwrite published files."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" assets/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-manifests
          path: manifests/
  distribute:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: package-manifests
          path: generated-manifests
      - name: Propose package manifest update
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p Casks bucket
          cp generated-manifests/Casks/rustboard.rb Casks/rustboard.rb
          cp generated-manifests/bucket/rustboard.json bucket/rustboard.json
          git add -- Casks/rustboard.rb bucket/rustboard.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update release package manifests'
          branch="release-manifests/$RELEASE_TAG"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --title "Update packages to $RELEASE_TAG" --body "Update Homebrew and Scoop manifests for $RELEASE_TAG."
          # GITHUB_TOKEN-created pull requests do not trigger pull_request workflows.
          gh workflow run ci.yml --ref "$branch"
