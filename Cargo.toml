[package]
name = "rustboard"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[dependencies]
anyhow = "1"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Console", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO"] }


windows-core = "0.61"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"



[[bin]]
name = "rustboard"
path = "src/bin/rustboard.rs"

[[bin]]
name = "rustboardd"
path = "src/bin/rustboardd.rs"

[[example]]
name = "small_batch_probe"
path = "tools/rust/windows/small_batch_probe.rs"

[[example]]
name = "stream_probe"
path = "tools/rust/windows/stream_probe.rs"

[[example]]
name = "stream_throughput"
path = "tools/rust/windows/stream_throughput.rs"

[[example]]
name = "macos_acceptance_peer"
path = "tools/rust/macos/acceptance_peer.rs"

[[example]]
name = "ole_clipboard"
path = "tools/rust/windows/ole_clipboard.rs"
[[example]]
name = "lan_throughput"
path = "tools/rust/core/lan_throughput.rs"

[[example]]
name = "loopback_peer"
path = "tools/rust/core/loopback_peer.rs"

[[example]]
name = "peer_probe"
path = "tools/rust/core/peer_probe.rs"

[[example]]
name = "throughput"
path = "tools/rust/core/throughput.rs"
